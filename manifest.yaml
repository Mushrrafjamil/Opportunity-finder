contract: v1                 # runtime contract version — never remove
name: opportunity-finder
version: 1.0.0                # bump to republish; published versions are frozen
description: "A general assistant with an isolated read-only web probe action."

runtime:
  framework: langgraph        # v1: langgraph only
  python: "3.12"
  entrypoint: src/agent.py:graph   # file:object — the graph the runner invokes
  timeout_seconds: 300

dependencies:
  lockfile: requirements.lock # generated by `gravity validate` (uv) — exact pins

# -> rendered as the consumer's form
inputs:
  - name: query
    type: text
    label: "What should the agent do?"
    required: true

# -> becomes the scoped run token; the gateway enforces per call
permissions:
  tools:
    - example.echo
    - web.search
    - web.fetch
    - web.fetch_proxied
  models:
    tier: standard             # model cap — no premium-tier burn on this agent

resources:
  memory_mb: 512                # a request — the platform clamps, never guarantees

actions:
  - name: answer
    label: "Answer my query"
    default: true
  - name: web_probe
    label: "Probe public job pages"
